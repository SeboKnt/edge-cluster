---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nexus-db-secret
  namespace: nexus
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: nexus-db-secret
      namespace: nexus
    type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nexus-db
  namespace: nexus
spec:
  instances: 2
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: nexusdb
      owner: nexus
      secret:
        name: nexus-db-secret
