apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 2
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: registry
      owner: harbor
      secret:
        name: harbor-db-secret
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-db-secret
  namespace: harbor
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: harbor-db-secret
      namespace: harbor
