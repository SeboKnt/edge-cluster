---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 24h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
      interval: 12h
  values:
    expose:
      type: clusterIP
      tls:
        enabled: false
    externalURL: https://registry.edge.youngandhungry.org
    nginx:
      tls:
        enabled: false
    portal:
      tls:
        enabled: false
    database:
      type: external
      external:
        host: harbor-db-rw.harbor.svc.cluster.local
        port: "5432"
        username: harbor
        existingSecret: harbor-db-secret
        coreDatabase: registry
        sslmode: disable
    redis:
      type: internal
    trivy:
      enabled: true
    notary:
      enabled: false
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: ceph-block
          size: 100Gi
          accessMode: ReadWriteOnce
        jobservice:
          storageClass: longhorn
          size: 1Gi
        database:
          storageClass: longhorn
          size: 1Gi
        redis:
          storageClass: longhorn
          size: 1Gi
        trivy:
          storageClass: longhorn
          size: 5Gi
