apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bitnami
  namespace: keycloak
spec:
  type: oci
  interval: 24h
  url: oci://registry-1.docker.io/bitnamicharts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 30m
  chart:
    spec:
      chart: keycloak
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: keycloak
      interval: 12h
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak
      tag: "26.3.3-debian-12-r0"
    auth:
      adminUser: admin
      adminPassword: "changeme"
    postgresql:
      enabled: false
    externalDatabase:
      host: keycloak-db-rw.keycloak.svc.cluster.local
      user: app
      database: app
      password: ""
      existingSecret: "keycloak-db-app"
      existingSecretPasswordKey: "password"
    proxyHeaders: xforwarded
    resources:
      limits:
        cpu: 1000m
        memory: 1536Mi
      requests:
        cpu: 500m
        memory: 512Mi
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

