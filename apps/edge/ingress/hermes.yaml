---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  parentRefs:
  - name: shared-gateway
    namespace: kube-system
  hostnames:
  - "hermes.edge.youngandhungry.org"
  rules:
  - backendRefs:
    - name: hermes
      port: 8642
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
  namespace: hermes
spec:
  parentRefs:
  - name: shared-gateway
    namespace: kube-system
  hostnames:
  - "hermes-dash.edge.youngandhungry.org"
  rules:
  - backendRefs:
    - name: hermes
      port: 9119