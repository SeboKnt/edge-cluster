apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openwebui
  namespace: llama
spec:
  interval: 24h
  url: https://helm.openwebui.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: llama
spec:
  interval: 2h
  chart:
    spec:
      chart: open-webui
      version: 13.3.1
      sourceRef:
        kind: HelmRepository
        name: openwebui
        namespace: llama
      interval: 2h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    ollama:
      enabled: false
    extraEnvVars:
      - name: OLLAMA_BASE_URL
        value: "http://ollama.llama.svc.cluster.local:11434"
    ingress:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn-1replica
